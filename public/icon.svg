<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.3" />

  <!-- Grid lines -->
  <line x1="64" y1="384" x2="448" y2="384" stroke="#334155" stroke-width="3" stroke-dasharray="4 4" />
  <line x1="256" y1="110" x2="256" y2="384" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Shaded Probability Tail Area (Central to Right) -->
  <path d="M 210 384 
           L 210 230 
           C 230 190, 245 150, 256 150
           C 267 150, 282 190, 302 230
           C 335 295, 375 365, 410 384
           Z" fill="url(#areaGrad)" />

  <!-- Bell Curve Path -->
  <path d="M 64 380 
           C 130 380, 180 340, 210 230 
           C 230 155, 245 140, 256 140 
           C 267 140, 282 155, 302 230 
           C 332 340, 382 380, 448 380" 
        fill="none" 
        stroke="url(#curveGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Mean marker / Mu -->
  <circle cx="256" cy="140" r="9" fill="#38bdf8" />
  
  <!-- Critical bounds vertical indicator -->
  <line x1="210" y1="230" x2="210" y2="384" stroke="#818cf8" stroke-width="4" stroke-dasharray="6 4" />
  <line x1="340" y1="280" x2="340" y2="384" stroke="#c084fc" stroke-width="4" stroke-dasharray="6 4" />
  
  <!-- Base Axis -->
  <line x1="56" y1="384" x2="456" y2="384" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <polyline points="446,376 458,384 446,392" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Greek Letters & Stats Symbols -->
  <text x="256" y="445" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">P(X ≤ x)</text>
</svg>
